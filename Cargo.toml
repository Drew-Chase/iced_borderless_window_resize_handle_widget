[package]
name = "iced_borderless_window_resize_handle_widget"
version = "0.1.1"
edition = "2024"
description = "A lightweight iced overlay widget that restores edge and corner resizing for borderless windows using native OS resize calls."
keywords = ["gui", "iced", "widget", "window", "borderless"]
categories = ["gui"]
license = "MIT"
authors = ["Drew Chase"]
readme = "README.md"


[dependencies]
# `default-features = false` keeps consumers in control of the renderer and
# executor features: the widget is renderer-agnostic and only needs the
# `advanced` module gating.
#
# `thread-pool` is still required because the `iced` meta-crate refuses to
# compile without an executor feature. It is the lowest-priority executor
# (tokio and smol always win the `executor::Default` selection) and adds no
# new dependencies — only the `futures-executor` component of the `futures`
# crate, which iced already depends on. Consumers that already enable any
# executor feature pay literally nothing for it.
iced = { version = "0.14", default-features = false, features = [
    "advanced",
    "thread-pool",
] }

[dev-dependencies]
iced = { version = "0.14", default-features = false, features = [
    "advanced",
    "thread-pool",
    "tiny-skia",
] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
] }